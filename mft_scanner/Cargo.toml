[package]
name = "mft_scanner"
version = "0.4.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# Microsoft Research's allocator. Cuts ~10-20% off scan time on alloc-heavy
# workloads like ours (one String per file/dir entry). No unsafe API surface
# is needed — just register it as the global allocator in main.rs.
mimalloc = { version = "0.1", default-features = false }
# MFT-based fast scanner for local NTFS volumes. Higher-level wrapper around
# the `ntfs` crate that handles raw volume access, MFT iteration, and path
# reconstruction. Requires admin to open `\\.\C:` raw, so the binary's
# manifest sets requestedExecutionLevel: admin and the dispatcher silently
# falls through to the FindFirstFile walker if elevation isn't present.
ntfs-reader = "0.3"
